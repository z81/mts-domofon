[package]
name = "domru-mts"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[features]
default = []
test-support = []

[lib]
name = "domru_mts"
path = "src/lib.rs"

[[bin]]
name = "domru-mts"
path = "src/main.rs"

[[test]]
name = "mts_client"
path = "tests/mts_client.rs"
required-features = ["test-support"]

[[test]]
name = "provider_bootstrap"
path = "tests/provider_bootstrap.rs"
required-features = ["test-support"]

[[test]]
name = "dashboard_provider"
path = "tests/dashboard_provider.rs"
required-features = ["test-support"]

[[test]]
name = "auth_coordinator"
path = "tests/auth_coordinator.rs"
required-features = ["test-support"]

[[test]]
name = "auth_api"
path = "tests/auth_api.rs"
required-features = ["test-support"]

[[test]]
name = "legacy_sms_auth"
path = "tests/legacy_sms_auth.rs"
required-features = ["test-support"]

[[test]]
name = "runtime_api"
path = "tests/runtime_api.rs"
required-features = ["test-support"]

[[test]]
name = "intercom_provider"
path = "tests/contract/intercom_provider.rs"
required-features = ["test-support"]

[[test]]
name = "snapshot_proxy"
path = "tests/snapshot_proxy.rs"
required-features = ["test-support"]

[[test]]
name = "door_open"
path = "tests/door_open.rs"
required-features = ["test-support"]

[[test]]
name = "call_api"
path = "tests/call_api.rs"
required-features = ["test-support"]

[dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
fcm-push-listener = { path = "vendor/fcm-push-listener" }
fs2 = "0.4"
http = "1"
httpdate = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "gzip", "json", "multipart", "query", "rustls", "stream"] }
rand = "0.9"
percent-encoding = "2"
md-5 = { version = "0.11.0", features = ["zeroize"] }
rustix = { version = "1", features = ["fs"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "url"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "cors", "fs", "limit", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
subtle = "2.6.1"
url = { version = "2", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "url"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1.9.0", features = ["derive", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"
